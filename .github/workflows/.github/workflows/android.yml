name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Find the Android project
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then unzip -q -o "$z" -d _android_zip; fi
          done
          G=$(find . -name gradlew -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$G" ]; then
            echo "::error::Android project not found. Upload the zip file to the repository root."
            ls -la
            exit 1
          fi
          chmod +x "$G"
          echo "ANDROID_DIR=$(dirname "$G")" >> "$GITHUB_ENV"
          echo "Found project in: $(dirname "$G")"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shorouk-calculator-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
